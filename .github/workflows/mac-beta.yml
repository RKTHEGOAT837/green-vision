# Build the macOS beta of Green Vision.
#
# WHY THIS IS A WORKFLOW AND NOT A BUILD STEP ON THE DEV MACHINE.
# The installer ships a complete offline engine: a CPython, the OpenVINO
# runtime, a map index and a 1.2 GB INT4 language model. On Windows every
# one of those is a Windows binary. `electron-builder --mac` on a Windows
# box would package the same folder into a .app and the result would launch
# to a dead engine - the studio would open and nothing would analyse. A
# macOS build needs a macOS machine to assemble a macOS engine, which is
# what this runner is for.
#
# WHAT THIS BUILD DOES NOT CARRY, and why the word beta is on it:
#   * the local OSM index (75 MB) is not in the repository, so map reads
#     fall back to the public Overpass mirrors - slower, and rate limited;
#   * the language model is fetched here rather than committed, and if that
#     download fails the app still runs with the model absent, which the
#     assistant already handles;
#   * nothing is code-signed or notarised, so macOS will refuse the first
#     open until it is allowed through in System Settings.
name: macOS beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (must match desktop/package.json)
        required: true
        default: "1.3.0"
      with_model:
        description: Fetch and bundle the 1.2 GB language model
        type: boolean
        default: true

permissions:
  contents: write              # so the runner can publish the build itself

jobs:
  build:
    runs-on: macos-14          # Apple Silicon
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The studio bundle. dist_app is not committed - it is generated from
      # the trained outputs, which are - so it has to be baked here, with
      # --keep-local-osm because this build runs beside its own engine.
      - name: Bake the studio bundle
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip install numpy pandas h3 pyyaml python-dateutil requests
          python scripts/build_static.py --out dist_app --keep-local-osm \
            --cities config/city.yaml config/bengaluru.yaml config/chennai.yaml \
                     config/delhi.yaml config/mumbai.yaml
          test -f dist_app/index.html

      # The engine. A relocatable venv is the closest macOS equivalent of
      # the embeddable CPython the Windows build uses. Only what the engine
      # imports at RUN time is installed - deliberately not
      # requirements.txt, which also carries the training and export stack
      # the app never loads.
      - name: Build the macOS engine bundle
        run: |
          set -eux
          python -m venv --copies desktop/engine/python
          E=desktop/engine/python/bin/python3
          $E -m pip install --upgrade pip
          $E -m pip install numpy pandas h3 requests pyyaml python-dateutil openvino
          # openvino-genai carries the LLM pipeline. It does not publish a
          # wheel for every platform; when it is missing the assistant falls
          # back to its deterministic answers, which is a supported state,
          # so this must not fail the build.
          $E -m pip install openvino-genai openvino-tokenizers || \
            echo "::warning::openvino-genai has no wheel for this platform - the assistant will run without the language model"
          cp -R greenplan desktop/engine/greenplan
          cp -R config   desktop/engine/config
          cp -R data     desktop/engine/data
          cp -R web      desktop/engine/web || true
          mkdir -p desktop/engine/models
          cp -R models/ahmedabad models/bengaluru models/chennai models/delhi \
                models/mumbai models/intent desktop/engine/models/ 2>/dev/null || true
          $E -c "import openvino, numpy, pandas, h3; print('engine imports OK')"
          $E -c "import sys; sys.path.insert(0,'desktop/engine'); import greenplan; print('greenplan imports OK')"

      # The language model, fetched rather than committed - it is 1.2 GB and
      # does not belong in git. Its absence is a supported state, so a
      # failure here is a warning and not a stop.
      - name: Fetch the language model
        if: inputs.with_model
        continue-on-error: true
        run: |
          set -eux
          python -m pip install huggingface_hub
          python scripts/fetch_openvino_model.py
          mkdir -p desktop/engine/models/openvino
          cp -R models/openvino/* desktop/engine/models/openvino/
          du -sh desktop/engine/models/openvino

      - name: What is in the engine
        run: du -sh desktop/engine desktop/engine/* | sort -h

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci || npm install

      # Unsigned, like the Windows build. CSC_IDENTITY_AUTO_DISCOVERY=false
      # stops electron-builder hunting for a certificate that is not there
      # and failing the build over its absence.
      - name: Disk before the build
        run: df -h /

      # zip, not dmg.
      #
      # hdiutil could not make the disk image on the runner: the app is
      # about 1.9 GB an architecture once the engine and the language model
      # are inside it, and building two of those plus a read-write image of
      # each exhausted the space `hdiutil create` needs for scratch. It
      # failed with an input/output error writing the volume icon, then
      # could not even detach the half-made volume.
      #
      # A zip of the .app is the same application and needs no disk image at
      # all: unzip it, drag it to Applications. A dmg is nicer to receive
      # and can come back when this is not a beta - it is presentation, and
      # presentation is not worth being the reason there is no mac build.
      - name: Build the app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --publish never

      - name: Disk after the build
        if: always()
        run: df -h /

      # Proof it assembled, before anybody downloads it: the engine has to
      # be inside the .app, and its interpreter has to run from there.
      - name: Check the packaged app carries a working engine
        run: |
          set -eux
          APP=$(find desktop/release -maxdepth 2 -name "*.app" -type d | head -1)
          test -n "$APP"
          RES="$APP/Contents/Resources"
          test -f "$RES/studio/index.html"
          test -x "$RES/engine/python/bin/python3"
          "$RES/engine/python/bin/python3" -c "import openvino, numpy, pandas, h3; print('packaged engine OK')"
          ls -la desktop/release/*.zip

      # ACTUALLY RUN IT.
      #
      # Everything above proves the app was assembled. None of it proves it
      # opens - and the author has no Mac, so without this step the first
      # person to find out whether a mac build launches is whoever
      # downloads it. This runner IS a Mac and has a window server, so it
      # can do the one test that matters: start the app, wait for the
      # engine it spawns to answer, ask the engine a real question, and
      # photograph the screen.
      - name: Launch it and prove the engine answers
        id: smoke
        run: |
          set -eux
          APP=$(find desktop/release -maxdepth 2 -name "*.app" -type d | head -1)
          "$APP/Contents/MacOS/GreenVision" --no-sandbox > /tmp/gv-app.log 2>&1 &
          APP_PID=$!

          # The engine is a Python process the app starts for itself. It
          # loads a 42-month panel before it answers, so this waits rather
          # than probing once.
          OK=""
          for i in $(seq 1 60); do
            sleep 5
            for PORT in 8000 8010 8020 8030 8040; do
              if curl -fsS --max-time 3 "http://127.0.0.1:$PORT/api/health" -o /tmp/gv-health.json; then
                OK="$PORT"; break 2
              fi
            done
            kill -0 $APP_PID 2>/dev/null || { echo "the app exited on its own"; break; }
          done

          if [ -z "$OK" ]; then
            echo "::error::the app did not bring up an engine"
            tail -50 /tmp/gv-app.log || true
            exit 1
          fi

          echo "engine answered on port $OK"
          python3 -c "import json;d=json.load(open('/tmp/gv-health.json'));print('ok',d.get('ok'),'| city',d.get('city'),'| llm',(d.get('assistant_llm') or {}).get('present'))"

          # A real question, through the real endpoint, against the engine
          # inside the .app.
          curl -fsS --max-time 120 -X POST "http://127.0.0.1:$OK/api/assistant"             -H "content-type: application/json"             -d '{"message":"what is green vision","lang":"en","context":{"aoi":{"lat":23.03,"lon":72.5,"km2":100},"place":"Bopal, Ahmedabad","readings":{}}}'             -o /tmp/gv-reply.json
          python3 -c "import json;d=json.load(open('/tmp/gv-reply.json'));print('intent',d.get('intent'));print((d.get('reply') or '')[:160])"

          # What it looks like, so a person can see it rather than take the
          # exit code on trust.
          screencapture -x /tmp/gv-screen.png || echo "::warning::no screenshot"
          kill $APP_PID 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-smoke-test-${{ inputs.version }}
          path: |
            /tmp/gv-screen.png
            /tmp/gv-app.log
            /tmp/gv-health.json
            /tmp/gv-reply.json
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: greenvision-mac-beta-${{ inputs.version }}
          path: desktop/release/*.zip
          if-no-files-found: error

      # Publish from the runner, not through a laptop.
      #
      # The build is about 2 GB. Pulling that down over a home connection
      # and pushing the same bytes back up to a release is slow, and it
      # failed halfway the first time it was tried - "an existing connection
      # was forcibly closed". The runner already has the files and is next
      # door to GitHub's storage, so it uploads them itself.
      #
      # The release lives in THIS repository rather than the downloads one,
      # because the token a workflow is given only reaches its own repo.
      # The download page reads the mac assets from here and the Windows
      # ones from there; both are resolved from the API at page load, so
      # neither goes stale.
      - name: Publish the mac beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          TAG="mac-v${{ inputs.version }}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1             || gh release create "$TAG" --repo "$GITHUB_REPOSITORY"                  --title "Green Vision ${{ inputs.version }} for macOS (beta)"                  --notes "Unsigned beta. Unzip, drag Green Vision to Applications, then right-click it and choose Open the first time.

          Built by the macOS beta workflow from ${GITHUB_SHA}."
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY"             --clobber desktop/release/*.zip
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets             --jq '.assets[] | "\(.name)  \(.size)"'
